name: Build Android App Bundle (AAB)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build Release AAB & APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Build Android App Bundle (AAB)
        run: gradle :app:bundleRelease --stacktrace

      - name: Build Universal Release APK (Optional)
        run: gradle :app:assembleRelease --stacktrace || true

      - name: Upload AAB Bundle Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FullQuizz-App-Bundle-AAB
          path: app/build/outputs/bundle/release/*.aab
          retention-days: 30

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FullQuizz-Release-APK
          path: app/build/outputs/apk/release/*.apk
          retention-days: 30
          if-no-files-found: ignore
