name: Build Android App Bundle (AAB)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build Release AAB & APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Grant execute permission for Gradle wrapper
        run: |
          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
          else
            gradle wrapper --gradle-version 8.12
            chmod +x ./gradlew
          fi

      - name: Build Android App Bundle (AAB)
        run: ./gradlew :app:bundleRelease --stacktrace

      - name: Build Universal Release APK (Optional)
        run: ./gradlew :app:assembleRelease --stacktrace || true

      - name: Upload AAB Bundle Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FullQuizz-App-Bundle-AAB
          path: app/build/outputs/bundle/release/*.aab
          retention-days: 30

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FullQuizz-Release-APK
          path: app/build/outputs/apk/release/*.apk
          retention-days: 30
          if-no-files-found: ignore
